name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run checks (format, warnings-as-errors, tests)
        run: make check
      - name: Package app bundle
        run: make app
