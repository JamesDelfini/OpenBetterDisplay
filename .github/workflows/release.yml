name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify build and tests
        run: |
          make check

      - name: Build and package app bundle
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          APP_VERSION="${VERSION}" make app

          ASSET_NAME="OpenBetterDisplay-${GITHUB_REF_NAME}-macos-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/OpenBetterDisplay.app \
            "build/${ASSET_NAME}"

          (cd build && shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256")
          echo "ASSET_NAME=${ASSET_NAME}" >> "${GITHUB_ENV}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<EOF
          ## OpenBetterDisplay ${GITHUB_REF_NAME}

          Lightweight open-source replacement for BetterDisplay on macOS: manage built-in and external monitors from the menu bar — OS-level display disconnect, Apple Silicon DDC/CI hardware brightness, Brightness Hotkeys, Display Mode filtering & Favorite Modes, ProMotion/VRR/NTSC Refresh Rate switching, and Main Display switching.

          ### Highlights
          - **Dark Translucent Menu Bar Popover** with human-readable monitor names, laptop/external icons, **Main Display Badge** (\`M\`) exclusively on the **Main Display**, and screen-bounded scrollable sizing
          - **OS-Level Display Disconnect** (\`CGSConfigureDisplayEnabled\`) with **Main Display** & last **Enabled Display** guardrails, **Reconnect All Displays**, and automatic restore on wake and quit
          - **Display Mode Browser, Filter Chips & 5 Favorite Modes:** collapsible **Display Mode** list with live \`Filter...\` chips (aspect ratio, Hz / ProMotion / VRR, color depth, \`HiDPI\` / \`LoDPI\`), macOS-vetted compatibility filtering, and per-display **Favorite Modes** (\`Manage...\` or right-click to assign slots \`1\`–\`5\`)
          - **Refresh Rate Picker:** collapsible **Refresh Rate** switcher surfacing \`ProMotion (Variable)\`, external Variable Refresh Rate ranges (e.g. \`48–120Hz (Variable)\`), standard integer rates, and display-exposed **NTSC Refresh Rates**
          - **Brightness Hotkeys & Floating HUD:** hardware media brightness keys and optional literal \`F1\`/\`F2\` capture (plus fine-step modifier) routed to **Follow Mouse Cursor**, **All Enabled Displays**, or **Main Display**, with Fn-key checker diagnostics and a floating HUD overlay on external displays
          - **3-Tier Brightness & Main Display Switching:** native backlight (\`DisplayServices\`), Apple Silicon DDC/CI (\`IOAVService\` VCP \`0x10\`), and software gamma fallback plus synchronous popover dismissal before **Main Display** handoff

          ### Installation
          1. Download and unzip \`${ASSET_NAME}\`.
          2. Move \`OpenBetterDisplay.app\` to \`/Applications\`.
          3. Because this release is ad-hoc signed (not notarized with an Apple Developer ID), clear the macOS quarantine attribute on first launch:
             \`\`\`bash
             xattr -dr com.apple.quarantine /Applications/OpenBetterDisplay.app
             \`\`\`
          EOF

          gh release create "${GITHUB_REF_NAME}" \
            "build/${ASSET_NAME}" \
            "build/${ASSET_NAME}.sha256" \
            --title "OpenBetterDisplay ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes
